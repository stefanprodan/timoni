server {
	listen       8080;
	server_name  {{ .metadata.name }};

	location / {
		root   /usr/share/nginx/html;
		index  index.html index.htm;
	}

	location /healthz {
		access_log off;
		default_type text/plain;
		return 200 "OK";
	}

	error_page  404              /404.html;
	error_page  500 502 503 504  /50x.html;
	location = /50x.html {
		root   /usr/share/nginx/html;
	}
}
