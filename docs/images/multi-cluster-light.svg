<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="A bundle and a runtime applied by timoni to a staging cluster and two production clusters">
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tm-node { fill: #ffffff; stroke: #ddd5ee; stroke-width: 1.5; }
    .tm-title { fill: #111827; font-size: 15px; font-weight: 600; }
    .tm-text { fill: #6b7280; font-size: 12.5px; }
    .tm-edge { fill: none; stroke: #7e56c2; stroke-width: 1.5; }
    .tm-arrowhead { fill: #7e56c2; }
    .tm-accent { fill: #7e56c2; }
    .tm-accent-text { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .tm-ok { fill: #22c55e; }
  </style>
  <defs>
    <marker id="tm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="tm-arrowhead" />
    </marker>
  </defs>
  <rect x="20" y="24" width="200" height="72" rx="12" class="tm-node" />
  <text x="40" y="55" class="tm-title">OCI Registry</text>
  <text x="40" y="76" class="tm-text">modules</text>
  <rect x="20" y="144" width="200" height="72" rx="12" class="tm-node" />
  <text x="40" y="175" class="tm-title">Bundle</text>
  <text x="40" y="196" class="tm-text">instances</text>
  <rect x="20" y="264" width="200" height="72" rx="12" class="tm-node" />
  <text x="40" y="295" class="tm-title">Runtime</text>
  <text x="40" y="316" class="tm-text">clusters, values</text>
  <rect x="540" y="24" width="200" height="72" rx="12" class="tm-node" />
  <text x="560" y="55" class="tm-title">staging-eu</text>
  <text x="560" y="76" class="tm-text">group: staging</text>
  <circle cx="716" cy="52" r="4.5" class="tm-ok" />
  <rect x="540" y="144" width="200" height="72" rx="12" class="tm-node" />
  <text x="560" y="175" class="tm-title">prod-eu</text>
  <text x="560" y="196" class="tm-text">group: production</text>
  <circle cx="716" cy="172" r="4.5" class="tm-ok" />
  <rect x="540" y="264" width="200" height="72" rx="12" class="tm-node" />
  <text x="560" y="295" class="tm-title">prod-us</text>
  <text x="560" y="316" class="tm-text">group: production</text>
  <circle cx="716" cy="292" r="4.5" class="tm-ok" />
  <path d="M 220 60 C 262 60, 258 168, 300 168" class="tm-edge" marker-end="url(#tm-arrow)" />
  <path d="M 460 168 C 502 168, 498 60, 540 60" class="tm-edge" marker-end="url(#tm-arrow)" />
  <path d="M 220 180 C 262 180, 258 180, 300 180" class="tm-edge" marker-end="url(#tm-arrow)" />
  <path d="M 460 180 C 502 180, 498 180, 540 180" class="tm-edge" marker-end="url(#tm-arrow)" />
  <path d="M 220 300 C 262 300, 258 192, 300 192" class="tm-edge" marker-end="url(#tm-arrow)" />
  <path d="M 460 192 C 502 192, 498 300, 540 300" class="tm-edge" marker-end="url(#tm-arrow)" />
  <rect x="300" y="152" width="160" height="56" rx="12" class="tm-accent" />
  <text x="380" y="185" text-anchor="middle" class="tm-accent-text">timoni bundle apply</text>
</svg>
